name: Validate
on:
  push:
    branches: [codex/main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: electron-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: ./scripts/setup-ffmpeg.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-windows-scripts.ps1
      - run: python -m unittest discover -p "test_*.py"
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund --foreground-scripts
        timeout-minutes: 10
        working-directory: electron-ui
      - run: npm run validate
        working-directory: electron-ui
      - run: node scripts/package.cjs
        working-directory: electron-ui
      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows-x64
          path: electron-ui/release/Apex Highlight Clipper-win32-x64
          retention-days: 7
